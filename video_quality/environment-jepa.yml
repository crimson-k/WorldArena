name: WorldArena_JEPA
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip>=25
  - pip:
      # torch 2.4/cu121 cannot execute on RTX 5090 (sm_120).
      - torch==2.10.0
      - torchvision==0.25.0
      - decord==0.6.0
      - av==12.3.0
      - numpy==2.2.6
      - opencv-python==4.12.0.88
      - pandas==2.2.2
      - PyYAML==6.0.3
      - scikit-learn==1.7.2
      - timm==1.0.22
      - tqdm==4.67.1
      # vjepa/videojedi are installed with --no-deps after this YAML because
      # vjepa metadata incorrectly restricts torchvision to <0.20.
