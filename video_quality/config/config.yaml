# === Configuration File Guide ===
model_name: __MODEL_NAME__

# NOTE:
# - `data.gt_path` and `data.val_base` are for the PREPROCESSED evaluation tree
#   created under `video_quality/data/` by `preprocess_datasets.py`.
# - Do NOT point them to your raw split outputs such as:
#   `/data/.../worldarena_auto_eval/gt_videos`
#   `/data/.../worldarena_auto_eval/<model_name>_test`
# - Raw inputs are passed on the command line to `run_evaluation.sh`:
#   `<GEN_VIDEO_DIR>` should be the raw generated-video folder (for example `.../worldarena_auto_eval/test1_test`)
#   `<SUMMARY_JSON>` should be the raw summary file (for example `.../worldarena_auto_eval/summary.json`)
# - Paths below can use the placeholder `__MODEL_NAME__`.
# - `run_evaluation.sh` and `run_action_following.sh` will replace it with the first CLI argument.

data:
  gt_path: /data/liuwenhao/WorldArena/video_quality/data/__MODEL_NAME__/gt_dataset
  val_base: /data/liuwenhao/WorldArena/video_quality/data/__MODEL_NAME__/generated_dataset
data_action_following:
  # NOTE:
  # - These are also PREPROCESSED directories produced by `preprocess_datasets_diversity.py`.
  # - Paths below can use the placeholder `__MODEL_NAME__`.
  gt_path: /data/liuwenhao/WorldArena/video_quality/data_action_following/__MODEL_NAME__/gt_dataset
  val_base: /data/liuwenhao/WorldArena/video_quality/data_action_following/__MODEL_NAME__/generated_dataset
save_path: /data/liuwenhao/WorldArena/video_quality/data/__MODEL_NAME__/output
save_path_action_following: /data/liuwenhao/WorldArena/video_quality/data/__MODEL_NAME__/output_action_following
ckpt:
  action_following: /data/liuwenhao/WorldArena/video_quality/models_downloaded/action_following/ViT-B-32.pt
  semantic_alignment:
    caption: /data/liuwenhao/WorldArena/video_quality/models_downloaded/semantic_alignment/Qwen2.5-VL-7B-Instruct
    CLIP: /data/liuwenhao/WorldArena/video_quality/models_downloaded/semantic_alignment/clip-vit-base-patch16
  depth_accuracy: /data/liuwenhao/WorldArena/video_quality/models_downloaded/depth_accuracy/Depth-Anything-V2-Small-hf
  aesthetic_quality:
    clip: /data/liuwenhao/WorldArena/video_quality/models_downloaded/aesthetic_quality/ViT-L-14.pt
    aesthetic_head: /data/liuwenhao/WorldArena/video_quality/models_downloaded/aesthetic_quality/sa_0_4_vit_l_14_linear.pth
  background_consistency:
    clip: /data/liuwenhao/WorldArena/video_quality/models_downloaded/action_following/ViT-B-32.pt
    raft: /data/liuwenhao/WorldArena/video_quality/models_downloaded/raft/raft-things.pth
  dynamic_degree:
    raft: /data/liuwenhao/WorldArena/video_quality/models_downloaded/raft/raft-things.pth
  flow_score:
    raft: /data/liuwenhao/WorldArena/video_quality/models_downloaded/raft/raft-things.pth
  photometric_smoothness:
    cfg: /data/liuwenhao/WorldArena/video_quality/WorldArena/third_party/SEA-RAFT/config/eval/spring-M.json
    model: /data/liuwenhao/WorldArena/video_quality/models_downloaded/photometric_smoothness/model.safetensors
  motion_smoothness:
