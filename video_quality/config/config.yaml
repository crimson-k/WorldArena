  image_quality:
    musiq: /data/liuwenhao/WorldArena/video_quality/models_downloaded/image_quality/musiq_spaq_ckpt-358bb6af.pth
  subject_consistency:
    repo: /data/liuwenhao/WorldArena/video_quality/models_downloaded/subject_consistency/facebookresearch_dino_main
    weight: /data/liuwenhao/WorldArena/video_quality/models_downloaded/subject_consistency/dino_vitbase16_pretrain.pth
